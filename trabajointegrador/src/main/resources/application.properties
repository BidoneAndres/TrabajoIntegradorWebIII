# cuando lo pasen al servidor chickenkiller hay que poner la url y real correspondiente, en mi caso use edu-spring-realm-dev
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:1405/realms/edu-spring-realm-dev
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.cernikiw3.chickenkiller.com/realms/edu-spring-realm-dev
# Le dice a Spring la dirección web exacta donde Keycloak publica sus claves públicas
# Cuando Keycloak crea el token , lo "firma" criptográficamente 
# con una clave privada secreta que solo él conoce. Para que Spring sepa que ese token es original entra a esa URL
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1405/realms/edu-spring-realm-dev/protocol/openid-connect/certs
